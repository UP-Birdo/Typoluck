<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Typoluck">
    <title>Typoluck</title>

    <!--
        Das Zeichen der App: eine orange Buchstaben-Kachel mit einem T, und
        eine kleine blaue Kachel, die schräg darüber liegt.

        WARUM GENAU DIESE FORMEN
        Orange und Blau sind die Kachelfarben des Spiels („richtig" und
        „kommt vor"). Bis 0.6.1 waren es Grün und Gelb — das ist der Look
        des NYT-Spiels und seit 0.6.2 tabu (js\darstellung.js,
        „Kachelfarben-Sperre"). Das T ist der Anfang von Typoluck. Mehr
        als zwei Flächen und ein Buchstabe verträgt das Zeichen nicht — es
        muss bei 32 Pixeln (Lesezeichen im Browser) noch lesbar sein.

        Das T ist aus zwei Rechtecken gebaut, nicht aus einer Schrift: So
        sieht es auf jedem Gerät gleich aus, und tools\Icons-Erzeugen.ps1
        kann es mit denselben Koordinaten als PNG nachzeichnen. WER HIER
        ETWAS ÄNDERT, ÄNDERT BEIDE DATEIEN.

        Bewusst gezeichnete Formen, kein Emoji (Haus-Regel).
    -->

    <rect x="0" y="0" width="512" height="512" rx="96" ry="96" fill="#5b3cc4"/>

    <!-- Die orange Kachel mit dem T -->
    <rect x="96" y="160" width="256" height="256" rx="36" ry="36" fill="#e8702a"/>
    <rect x="144" y="212" width="160" height="44" fill="#ffffff"/>
    <rect x="202" y="212" width="44" height="160" fill="#ffffff"/>

    <!-- Die blaue Kachel, schräg darüber -->
    <rect x="312" y="88" width="104" height="104" rx="22" ry="22" fill="#3f8fe0"
          stroke="#5b3cc4" stroke-width="12"/>
</svg>
