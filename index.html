<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <!-- `viewport-fit=cover` lässt die Seite bis unter den iPhone-Balken
         reichen; die Leiste unten hält sich den Streifen selbst frei
         (env(safe-area-inset-bottom) in css\stil.css). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Typoluck</title>
    <meta name="description" content="Wortspiele mit Freunden — jeden Tag ein neues Wort.">

    <!-- Zeichen der App: nur PNG. Seit 0.8.1 die gerenderten UPCrew-Icons
         aus der Design-Sitzung (Design\3D-Schrift\final\icons, dort
         „vorläufig", kopiert mit Icons-Verteilen.cmd). Das alte icon.svg
         zeigt das alte Logo und ist deshalb nicht mehr eingebunden. -->
    <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
    <link rel="apple-touch-icon" href="icons/icon-180.png">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#1f5fa8">
    <meta name="apple-mobile-web-app-title" content="Typoluck">

    <!-- Das Aussehen in drei Teilen. DIE REIHENFOLGE IST DIE KASKADE:
         erst die Grundlagen (Variablen, Knöpfe, Karten), dann die
         Bildschirme, zuletzt das Spielbrett. -->
    <link rel="stylesheet" href="css/stil.css">
    <link rel="stylesheet" href="css/stil-bildschirme.css">
    <link rel="stylesheet" href="css/stil-wordle.css">
    <!-- Das UPCrew-Studio-Intro: gemeinsamer Baustein aller UPCrew-Apps,
         kopiert aus Design\3D-Schrift\final (seit 0.6.1). -->
    <link rel="stylesheet" href="css/upcrew-intro.css">
    <!-- Seit 0.8.0 (UPCrew-Runde 3): die Knopf-Familien K1-K6 und der Tab
         „Anpassen" — ebenfalls kopierte Bausteine, NACH dem eigenen Stil,
         damit ihre Regeln gelten. -->
    <link rel="stylesheet" href="css/upcrew-knoepfe.css">
    <link rel="stylesheet" href="css/upcrew-anpassen.css">
</head>
<body>

    <!-- Unsichtbare Überschrift für Vorleseprogramme; test-syntax.js prüft
         hier den Namen der App. -->
    <h1 class="nur-vorlesen">Typoluck</h1>

    <p class="hinweis" id="hinweis" role="status" hidden></p>

    <!-- Profil, Freunde und Einstellungen liegen im Menü hinter den drei
         Balken oben rechts auf dem Start (seit 0.3.0, wie in Blunderluck). -->
    <main class="inhalt" id="inhalt"></main>

    <!-- Die Leiste unten (seit 0.5.0): steht fest auf JEDEM Bildschirm —
         seit 0.8.0 fünf Plätze: Aufgaben, Bald (Platzhalter), in der
         Mitte Start, Rangliste, ganz rechts Anpassen.
         Die Einträge baut js\navigation.js (NAVIGATION.LEISTE). -->
    <nav class="leiste" id="leiste" aria-label="Hauptbereiche" hidden></nav>

    <!-- Das Anmelde-Vollbild (js\anmeldung.js) liegt über allem ausser den
         Dialogen. -->
    <div class="anmeldung" id="anmeldung" hidden></div>

    <!-- Das UPCrew-Intro (js\upcrew-intro.js, angepasst in js\intro.js):
         liegt beim Start kurz über allem, die App lädt darunter weiter. -->
    <div class="upi" id="intro" hidden></div>

    <div class="dialog-hintergrund" id="dialog" hidden></div>

    <p class="kurzmeldung" id="kurzmeldung" role="status" aria-live="polite" hidden></p>

    <!-- Reihenfolge zählt: erst Einstellungen und Datenlogik (ohne
         Bildschirm), dann die Bausteine, dann die Bildschirme, zuletzt der
         Startpunkt. sw.js führt dieselbe Liste in derselben Reihenfolge. -->
    <script src="js/konfig.js"></script>
    <script src="js/konto.js"></script>
    <script src="js/versiegelung.js"></script>
    <script src="js/spieler.js"></script>
    <script src="js/ich.js"></script>
    <!-- Die UPCrew-Bausteine (kopiert aus Design\3D-Schrift\final, nie
         abwandeln) stehen VOR darstellung.js: Das Aussehen wird schon beim
         Laden angewendet, damit nichts in alten Farben aufblitzt. Seit 0.8.0
         hält upcrew-aussehen.js hell/dunkel, Farbwelt, Schrift und Knöpfe
         für ALLE UPCrew-Spiele; darstellung.js direkt danach ist der frühe
         Aufruf (einmalig die alte Wahl übergeben, dann anwenden). -->
    <script src="js/upcrew-intro.js"></script>
    <script src="js/upcrew-farbwelten.js"></script>
    <script src="js/upcrew-aussehen.js"></script>
    <script src="js/darstellung.js"></script>
    <script src="js/upcrew-anpassen.js"></script>
    <script src="js/speicher.js"></script>
    <script src="js/abgleich.js"></script>
    <script src="js/woerter-de.js"></script>
    <script src="js/wordle.js"></script>
    <script src="js/ergebnisse.js"></script>
    <script src="js/rangliste.js"></script>
    <script src="js/bausteine.js"></script>
    <script src="js/zustand.js"></script>
    <script src="js/dialog.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/anmeldung.js"></script>
    <script src="js/bildschirm-start.js"></script>
    <script src="js/bildschirm-wordle.js"></script>
    <script src="js/bildschirm-rangliste.js"></script>
    <script src="js/bildschirm-freunde.js"></script>
    <script src="js/bildschirm-profil.js"></script>
    <script src="js/bildschirm-einstellungen.js"></script>
    <script src="js/bildschirm-herausforderungen.js"></script>
    <script src="js/bildschirm-anpassen.js"></script>
    <script src="js/aussehen-abgleich.js"></script>
    <script src="js/wunsch.js"></script>
    <script src="js/werkstatt.js"></script>
    <script src="js/intro.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
